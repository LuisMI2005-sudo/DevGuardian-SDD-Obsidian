name: SDD y Obsidian
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Especificaciones, enlaces, Mermaid y Canvas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
